services:
  postgres:
    image: postgres:16-alpine
    container_name: meritcoin-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: meritcoin
      POSTGRES_PASSWORD: meritcoin
      POSTGRES_DB: meritcoin
    volumes:
      - meritcoin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meritcoin -d meritcoin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meritcoin_pgdata:
